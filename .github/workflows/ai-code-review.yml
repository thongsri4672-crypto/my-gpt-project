name: AI Code Review
on:
  push:
    branches:
      - main
permissions:
  contents: read
  issues: write
jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Collect changed code
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git ls-tree -r --name-only "$AFTER_SHA" > changed_files.txt
          else
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > changed_files.txt
          fi
          : > code.txt
          while IFS= read -r file; do
            case "$file" in
              .env*|*secret*|*credential*|*password*|*token*|*.pem|*.key|*node_modules/*|*dist/*|*build/*)
                continue
                ;;
            esac
            case "$file" in
              *.js|*.jsx|*.ts|*.tsx|*.py|*.java|*.go|*.rs|*.php|*.rb|*.cpp|*.c|*.h|*.cs|*.swift|*.kt|*.kts|*.json|*.yaml|*.yml|*.md)
                if [ -f "$file" ]; then
                  size=$(wc -c < "$file")
                  if [ "$size" -le 50000 ]; then
                    {
                      echo ""
                      echo "===== FILE: $file ====="
                      cat "$file"
                    } >> code.txt
                  fi
                fi
                ;;
            esac
          done < changed_files.txt
      - name: Ask GPT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          OPENAI_API_URL: https://api.openai.com/v1/responses
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not configured."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          with open("code.txt", "r", encoding="utf-8") as f:
              code = f.read()
          if not code.strip():
              result = """# AI Code Review
          ไม่มีไฟล์โค้ดที่รองรับถูกเปลี่ยนแปลงในการ Push ครั้งนี้
          """
          else:
              code = code[:120000]
              prompt = f"""
          คุณเป็น AI Code Reviewer
          ตรวจสอบโค้ดที่เพิ่งถูก Push ขึ้น GitHub
          งาน:
          1. ตรวจคำผิดใน comments, strings และข้อความต่าง ๆ
          2. ตรวจ syntax ที่เห็นได้ชัด
          3. ตรวจ bug และโค้ดที่อาจทำงานผิดพลาด
          4. สรุปหน้าที่ของแต่ละไฟล์
          5. ระบุปัญหาที่ควรแก้จากสำคัญมากไปน้อย
          6. บอกสิ่งที่ทำได้ดี
          7. ห้ามแก้ไขโค้ดเอง ให้รายงานผลเท่านั้น
          8. ถ้าไม่พบปัญหาสำคัญ ให้ระบุอย่างชัดเจน
          ตอบเป็น Markdown ภาษาไทย
          โค้ด:
          {code}
          """
              payload = {
                  "model": os.environ["OPENAI_MODEL"],
                  "input": prompt
              }
              request = urllib.request.Request(
                  os.environ["OPENAI_API_URL"],
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}",
                      "Content-Type": "application/json",
                      "Accept": "application/json"
                  },
                  method="POST"
              )
              last_error = None
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120
                      ) as response:
                          data = json.loads(
                              response.read().decode("utf-8")
                          )
                      result = data.get("output_text", "").strip()
                      if not result:
                          for item in data.get("output", []):
                              for part in item.get("content", []):
                                  text = part.get("text")
                                  if isinstance(text, str):
                                      result += text.strip() + "\n"
                      result = result.strip()
                      if not result:
                          raise RuntimeError(
                              "OpenAI returned an empty response."
                          )
                      break
                  except urllib.error.HTTPError as e:
                      body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                      last_error = (
                          f"HTTP {e.code}: {body[:2000]}"
                      )
                      if e.code not in (408, 409, 429) and e.code < 500:
                          raise RuntimeError(last_error)
                  except Exception as e:
                      last_error = str(e)
                  if attempt < 4:
                      time.sleep(2 ** attempt)
              else:
                  raise RuntimeError(
                      f"OpenAI request failed: {last_error}"
                  )
          with open("ai_review.md", "w", encoding="utf-8") as f:
              f.write(result)
          PY
      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s ai_review.md ]; then
            echo "AI review is empty."
            exit 1
          fi
          gh issue create \
            --title "AI Code Review - ${{ github.sha }}" \
            --body-file ai_review.md