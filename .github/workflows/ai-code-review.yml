name: AI Code Review
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  ai-review:
    name: Review pushed code with GPT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect changed code
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git ls-tree -r --name-only "$AFTER_SHA" > changed_files.txt
          else
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > changed_files.txt
          fi
          : > code.txt
          while IFS= read -r file; do
            case "$file" in
              .env|.env.*|*secret*|*credential*|*password*|*token*|*.pem|*.key|*.p12|*.pfx|*node_modules/*|*dist/*|*build/*|*.lock)
                continue
                ;;
            esac
            case "$file" in
              *.js|*.jsx|*.ts|*.tsx|*.py|*.java|*.go|*.rs|*.php|*.rb|*.cpp|*.c|*.h|*.cs|*.swift|*.kt|*.kts|*.json|*.yaml|*.yml|*.md|*.html|*.css)
                if [ -f "$file" ]; then
                  size=$(wc -c < "$file")
                  if [ "$size" -le 50000 ]; then
                    {
                      echo
                      echo "===== FILE: $file ====="
                      cat "$file"
                    } >> code.txt
                  fi
                fi
                ;;
            esac
          done < changed_files.txt
          echo "Changed files:"
          cat changed_files.txt
          echo "Collected code size: $(wc -c < code.txt) bytes"
      - name: Check OpenAI secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY repository secret is not configured."
            exit 1
          fi
      - name: Ask GPT
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          OPENAI_API_URL: https://api.openai.com/v1/responses
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          with open("code.txt", "r", encoding="utf-8") as f:
              code = f.read()
          if not code.strip():
              result = """# AI Code Review
          ไม่มีไฟล์โค้ดที่รองรับถูกเปลี่ยนแปลงในการ Push ครั้งนี้
          """
          else:
              code = code[:120000]
              prompt = f"""
          คุณเป็น AI Code Reviewer สำหรับโปรเจกต์ GitHub
          ตรวจสอบโค้ดที่เพิ่งถูก Push ขึ้น GitHub
          งานที่ต้องทำ:
          1. ตรวจคำผิดใน comments, strings และข้อความที่ผู้ใช้เห็น
          2. ตรวจ syntax และข้อผิดพลาดที่เห็นได้ชัด
          3. ตรวจ bug และ logic ที่อาจทำงานผิดพลาด
          4. ตรวจปัญหาด้านความปลอดภัยที่เห็นได้จากโค้ด
          5. สรุปหน้าที่ของแต่ละไฟล์ที่เปลี่ยน
          6. ระบุปัญหาที่ควรแก้ โดยเรียง Critical, High, Medium, Low
          7. บอกสิ่งที่ทำได้ดี
          8. ถ้าไม่พบปัญหาสำคัญ ให้ระบุชัดเจน
          9. ห้ามแก้ไขโค้ดเอง ให้รายงานผลเท่านั้น
          10. ห้ามเปิดเผยหรือสร้างค่าความลับ เช่น API keys, tokens หรือ passwords
          ตอบเป็น Markdown ภาษาไทย โดยใช้รูปแบบ:
          # AI Code Review
          ## สรุป
          ## ไฟล์ที่เปลี่ยน
          ## คำผิด
          ## ปัญหาและความเสี่ยง
          ## สิ่งที่ทำได้ดี
          ## ข้อเสนอแนะ
          โค้ด:
          {code}
          """
              payload = {
                  "model": os.environ["OPENAI_MODEL"],
                  "input": prompt
              }
              request = urllib.request.Request(
                  os.environ["OPENAI_API_URL"],
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}",
                      "Content-Type": "application/json",
                      "Accept": "application/json"
                  },
                  method="POST"
              )
              result = ""
              last_error = None
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120
                      ) as response:
                          data = json.loads(
                              response.read().decode("utf-8")
                          )
                      result = data.get(
                          "output_text",
                          ""
                      ).strip()
                      if not result:
                          parts = []
                          for item in data.get("output", []):
                              for part in item.get("content", []):
                                  text = part.get("text")
                                  if isinstance(text, str):
                                      parts.append(text)
                          result = "\n".join(parts).strip()
                      if not result:
                          raise RuntimeError(
                              "OpenAI returned an empty response."
                          )
                      break
                  except urllib.error.HTTPError as e:
                      body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                      last_error = (
                          f"HTTP {e.code}: {body[:2000]}"
                      )
                      if e.code not in (408, 409, 429) and e.code < 500:
                          raise RuntimeError(last_error)
                  except Exception as e:
                      last_error = str(e)
                  if attempt < 4:
                      time.sleep(2 ** attempt)
              else:
                  raise RuntimeError(
                      f"OpenAI request failed: {last_error}"
                  )
          with open(
              "ai_review.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(result)
          PY
      - name: Create GitHub Issue with review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s ai_review.md ]; then
            echo "::error::AI review is empty."
            exit 1
          fi
          {
            echo "# Automated AI Code Review"
            echo
            echo "**Commit:** ${{ github.sha }}"
            echo
            cat ai_review.md
          } > issue_body.md
          gh issue create \
            --title "AI Code Review - ${{ github.sha }}" \
            --body-file issue_body.md